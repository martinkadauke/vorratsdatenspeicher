# Packaging recipe for the VDS desktop app. Produces unsigned installers on the free path
# (AppImage runs clean; Win/Mac show a first-open warning until code-signing/notarization is
# added — a DEVELOPER cost, never the user's). Run per-OS on that OS (or in CI matrix):
#   npm run pack   # electron-builder --dir  → out/<platform>-unpacked (assemble only, fast check)
#   npm run dist   # full installer
#
# ⚠️ Before packaging, prune the backend to prod deps so node_modules isn't huge:
#     (cd ../backend && npm ci --omit=dev)   # then rebuild dist if needed
#
# Layout must match main.mjs's app.isPackaged branch: the backend forks from
# <resources>/backend/dist/index.js, and boot.mjs derives MIGRATIONS_DIR=<resources>/backend/
# migrations and PUBLIC_DIR=<resources>/frontend/dist from it — hence the extraResources map.

appId: com.vorratsdatenspeicher.desktop
productName: Vorratsdatenspeicher Desktop

# ⚠️ Space-free FILE names, or auto-update 404s. productName has spaces, so the default artifact
# name does too — and then the two sides disagree about what to call it: GitHub turns spaces into
# DOTS when the asset is uploaded, while electron-builder writes the HYPHENATED form into
# latest.yml. electron-updater dutifully requested
# "Vorratsdatenspeicher-Desktop-Setup-0.24.0.exe" from a release that held
# "Vorratsdatenspeicher.Desktop.Setup.0.24.0.exe" → 404, on the first update that otherwise worked
# end to end. `name` is package.json's (already hyphenated), so both sides now agree.
artifactName: ${name}-Setup-${version}.${ext}
directories:
  output: out
  buildResources: build

# What goes into the app bundle (app.asar). The desktop glue + its node_modules (embedded-postgres
# wrapper); the actual PG binary is unpacked below because you can't exec from inside an asar.
files:
  - main.mjs
  - boot.mjs
  - tunnel.mjs
  - package.json
  - node_modules/**/*

# asar OFF on purpose. embedded-postgres resolves initdb/postgres/pg_ctl from its own platform
# package's module location; inside an asar that path points INTO the archive, and you cannot
# spawn an executable from a virtual filesystem → the packaged app died with
# "spawn …\initdb.exe ENOENT". asarUnpack does not help because the library computes the packed
# path itself and offers no override. The app payload here is glue code plus native binaries, so
# there is nothing an archive would buy us; backend/frontend already ship as extraResources.
asar: false

# The existing backend + frontend build, copied verbatim next to the app (no rebuild). `from` is
# relative to this desktop/ dir. backend/package.json is required so Node treats dist/*.js as ESM
# ("type":"module"); backend/node_modules must be PROD deps (see the prune note above).
extraResources:
  - from: ../backend/dist
    to: backend/dist
  - from: ../backend/migrations
    to: backend/migrations
  - from: ../backend/package.json
    to: backend/package.json
  - from: ../backend/node_modules
    to: backend/node_modules
  - from: ../frontend/dist
    to: frontend/dist
  # The Tailscale tunnel sidecar ("Handy verbinden"). Built per-OS by CI into tsnet-sidecar/bin;
  # the directory is committed (empty) because electron-builder aborts on a missing `from`. A local
  # build without Go therefore still packages — the app then reports the tunnel as unavailable
  # instead of failing to install.
  - from: tsnet-sidecar/bin
    to: tsnet
    filter: ['**/*', '!.gitkeep']
  # The bundled web search: SearXNG plus its own CPython, assembled per-OS by
  # searxng/build.sh (CI). Same arrangement as the sidecar above — committed empty so a checkout
  # that never ran the build still packages, and the app then simply has no web search rather than
  # failing to install. This is the biggest single thing in the installer (~150 MB unpacked); the
  # build script prunes debug symbols, Tcl/Tk, IDLE and CPython's test suite to get there.
  - from: searxng/bin
    to: searxng
    filter: ['**/*', '!.gitkeep']

# Where electron-updater looks for new versions. Declaring it here is also what makes
# electron-builder EMIT `latest.yml` / `latest-mac.yml` next to the installers — without those
# metadata files the in-app "Jetzt aktualisieren" button has nothing to read (v0.17.0 shipped
# without them). CI uploads them alongside the installers; publishing itself stays manual
# (`--publish never`), so nothing is pushed to GitHub by the build.
publish:
  provider: github
  owner: martinkadauke
  repo: vorratsdatenspeicher

win:
  target: nsis
nsis:
  # Uninstalling offers to take the data with it (database, receipt photos, tunnel keys) — see
  # build/installer.nsh for why it asks first. `include` is what wires that customUnInstall macro in.
  include: build/installer.nsh
mac:
  target: dmg
  category: public.app-category.finance
linux:
  target: AppImage
  category: Utility

# No `win.certificateFile` / `mac.notarize` on purpose — the free path. Add them later (Apple
# notarization ≈ $99/yr) to remove the first-open warning; users never pay either way.
