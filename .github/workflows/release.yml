name: Release

# Fires on a strict vMAJOR.MINOR.PATCH tag (or manually for an existing one). Builds the
# image FROM THE TAGGED COMMIT with APP_VERSION baked in, and publishes :X.Y.Z (+ :stable).
# Deploys nothing and never runs on a branch push, so cicd.yml's dev/stage/main pipelines
# are untouched. APP_VERSION must be baked at build time — that's what lets a running
# self-host instance know its release and show the "update available" banner.
#
# ⚠️ :stable is what every self-hoster pulls (README + in-app install snippet). The tag
# filter is strict so a pre-release tag (v1.1.0-rc1) can never move it, and a manual
# re-build of an OLDER tag must pass push_stable=false so :stable can't roll backwards.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true
      push_stable:
        description: 'Also move :stable to this build? Say false when rebuilding an OLD tag.'
        type: boolean
        default: true

permissions:
  contents: write   # needed to create the GitHub Release below (read is enough for everything else)
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: v
        # Via env, never interpolated into the script body (a tag is attacker-ish input).
        env:
          TAG_IN: ${{ github.event.inputs.tag || github.ref_name }}
          STABLE_IN: ${{ github.event.inputs.push_stable }}
        run: |
          TAG="$TAG_IN"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH — got '$TAG'"; exit 1
          fi
          echo "tag=$TAG"                                    >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"                            >> "$GITHUB_OUTPUT"
          # tag push → no input → default to moving :stable; dispatch honours the checkbox.
          if [ "$STABLE_IN" = "false" ]; then echo "stable=no" >> "$GITHUB_OUTPUT"; else echo "stable=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      # The tag's own commit — on a manual dispatch github.sha is the branch head, not the tag.
      - id: c
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.stable == 'yes' && format('ghcr.io/{0}:stable', github.repository) || '' }}
          build-args: |
            GIT_SHA=${{ steps.c.outputs.sha }}
            GIT_REF=${{ steps.v.outputs.tag }}
            APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A tag and a GitHub Release are different objects, and the in-app update banner reads the
      # RELEASES API (routes/admin.ts RELEASES_URL) — not tags. So a tag alone moves :stable while
      # every self-hoster's banner stays silent about it, and the "what's new since your version"
      # list, which comes from each release BODY, has nothing to show. That step has always been
      # manual and undocumented; v1.0.0-1.0.2 were all created by hand.
      #
      # DRAFT on purpose. /api/update-check filters `!r.draft`, so a draft is invisible to the
      # banner: the object always exists (nobody can forget it any more), but nothing nags users
      # until a human publishes it. --generate-notes gives a commit-derived starting point to edit
      # rather than shipping auto-prose — release notes are read by someone running VDS at home,
      # and that is a different audience from the commit log.
      - name: Draft the GitHub Release (publish by hand once the notes read well)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it alone"; exit 0
          fi
          gh release create "$TAG" --draft --generate-notes --title "VDS $TAG"
          echo "📝 drafted release $TAG — edit the notes and publish, or the update banner stays quiet"
      - run: echo "✅ published :${{ steps.v.outputs.version }} (stable=${{ steps.v.outputs.stable }}) APP_VERSION=${{ steps.v.outputs.version }}"
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}

  # Desktop installers (Electron): the SAME backend+frontend the image runs, wrapped with a
  # bundled Postgres so a non-technical user just downloads and double-clicks. Each OS must build
  # on its own runner (an Apple installer cannot be produced on Windows). Unsigned on purpose —
  # code signing is a DEVELOPER cost; users never pay either way. Windows shows a SmartScreen
  # "more info → run anyway" prompt. macOS is ad-hoc signed (mac.sign) so it STARTS at all on Apple
  # Silicon, and shows a one-time Gatekeeper warning that is cleared under System Settings →
  # Privacy & Security → "Open Anyway". ⚠️ Not ctrl-click → Open: Apple removed that in macOS 15.
  desktop:
    needs: build
    strategy:
      fail-fast: false          # a Mac failure must not deny Windows users their installer
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # "Handy verbinden": an embedded Tailscale node (tsnet) compiled into the installer, so the
      # user never installs or configures Tailscale themselves — one download, one app. Must be
      # built on the target OS like everything else here; the name is user-visible (it is what the
      # Windows firewall prompt and macOS's incoming-connections dialog show).
      - name: Build the tunnel sidecar
        working-directory: desktop/tsnet-sidecar
        shell: bash
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = "Windows" ]; then out="bin/Vorratsdatenspeicher Verbindung.exe";
          else out="bin/Vorratsdatenspeicher Verbindung"; fi
          go build -ldflags="-s -w" -o "$out" .
          ls -la bin

      # The bundled web search, assembled per OS exactly like the sidecar above. Its own script
      # because the assembly is fiddly (a tarball, never a clone — four files in the SearXNG repo
      # carry a colon and Windows cannot check them out) and it ends by proving the result imports,
      # so a broken bundle fails the BUILD instead of shipping as a silently searchless app.
      - name: Build the bundled web search
        working-directory: desktop
        shell: bash
        run: bash searxng/build.sh searxng/bin

      # The desktop bundle ships the built frontend + the built backend. Dev deps are needed to
      # BUILD the backend and are pruned afterwards, so the installer carries runtime deps only.
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build backend
        working-directory: backend
        run: npm ci && npm run build
      - name: Prune backend to production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      # ⚠️ BEFORE packaging. electron-builder's files: is an allow-list, so an import added to the
      # shell without a matching entry builds green and dies on the user's first launch. v0.37.0
      # shipped that and had to be withdrawn; this turns it into a failed build instead.
      - name: Check that every shell module is packaged
        working-directory: desktop
        run: node scripts/check-packaging.mjs

      # extraMetadata.version stamps the RELEASE version into the packaged app: it names the
      # artifacts (…Setup 1.0.16.exe, not the stale 1.0.0 from desktop/package.json) and is what
      # app.getVersion() — and therefore the in-app version/update check — reports at runtime.
      - name: Build installer
        working-directory: desktop
        shell: bash          # same syntax on both runners (windows-latest defaults to pwsh)
        env:
          # ⚠️ This has NOTHING to do with publishing — that is `--publish never` below. It stops
          # electron-builder picking up a stray certificate from the runner keychain. What the old
          # comment hid: it also meant NO signature at all, and an unsigned arm64 app is reported by
          # macOS as "damaged", so no Mac could ever open our build. desktop/scripts/adhoc-sign.mjs
          # now supplies an ad-hoc signature independently of this flag.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          VDS_VERSION: ${{ needs.build.outputs.version }}
        run: npm ci && npx electron-builder --publish never --config.extraMetadata.version="$VDS_VERSION"

      # ⚠️ Prove the signature exists. Signing is the difference between an installer that works on
      # a Mac and one that cannot be opened at all, and its absence was invisible for every release
      # so far — the build was green each time. `codesign --verify` fails the build instead.
      - name: Verify the mac app is really signed
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        run: |
          app=(out/mac-arm64/*.app)
          echo "verifying: ${app[0]}"
          codesign -dv --verbose=4 "${app[0]}"
          codesign --verify --deep --strict --verbose=2 "${app[0]}"

      # Attach to the (draft) GitHub Release the build job created, so one tag yields the Docker
      # image AND the desktop installers — and /download can read them straight from the API.
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/out/*.exe desktop/out/*.dmg desktop/out/*.AppImage desktop/out/*.zip desktop/out/*.blockmap desktop/out/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installer artifacts found"; exit 1; fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
