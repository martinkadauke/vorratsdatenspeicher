name: CI/CD

on:
  push:
    branches: [main, stage, dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.x.outputs.tag }}
      env: ${{ steps.x.outputs.env }}
      port: ${{ steps.x.outputs.port }}
      stack: ${{ steps.x.outputs.stack }}
      db_secret: ${{ steps.x.outputs.db_secret }}
    steps:
      - id: x
        run: |
          case "${{ github.ref_name }}" in
            main)
              echo "tag=latest"        >> $GITHUB_OUTPUT
              echo "env=production"    >> $GITHUB_OUTPUT
              echo "port=8766"         >> $GITHUB_OUTPUT
              echo "stack=vds"         >> $GITHUB_OUTPUT
              echo "db_secret=DATABASE_URL" >> $GITHUB_OUTPUT
              ;;
            stage)
              echo "tag=stage"               >> $GITHUB_OUTPUT
              echo "env=staging"             >> $GITHUB_OUTPUT
              echo "port=8767"               >> $GITHUB_OUTPUT
              echo "stack=vds-stage"         >> $GITHUB_OUTPUT
              echo "db_secret=DATABASE_URL_STAGING" >> $GITHUB_OUTPUT
              ;;
            dev)
              echo "tag=dev"             >> $GITHUB_OUTPUT
              echo "env=development"     >> $GITHUB_OUTPUT
              echo "port=8768"           >> $GITHUB_OUTPUT
              echo "stack=vds-dev"       >> $GITHUB_OUTPUT
              echo "db_secret=DATABASE_URL_DEV" >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [meta, build]
    runs-on: [self-hosted, swarm]
    environment: ${{ needs.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # Every deploy pulls a fresh <sha>-tagged image; old ones pile up and eventually
      # fill the runner's small disk (No space left on device → deploy fails). Prune
      # BEFORE the pull. `-a` keeps images still in use by a running service (all 3 envs
      # + the image we're about to replace, so a rollback stays local), and only clears
      # the orphaned older tags. `|| true` so a prune hiccup never blocks a deploy.
      - name: Free disk (prune unused docker images/containers)
        run: |
          docker container prune -f || true
          docker image prune -af || true
          df -h / | tail -1 || true
      - name: Deploy stack (rolling update)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          DATABASE_URL: ${{ secrets[needs.meta.outputs.db_secret] }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          PORT: ${{ needs.meta.outputs.port }}
          STACK: ${{ needs.meta.outputs.stack }}
          VDS_ENV: ${{ needs.meta.outputs.env == 'production' && 'prod' || needs.meta.outputs.env == 'staging' && 'stage' || 'dev' }}
          # Optional host path for receipt photos. If unset, stack.yml falls back
          # to a named volume (vds-receipts) so deploys never break.
          RECEIPTS_VOLUME: ${{ vars.RECEIPTS_VOLUME }}
        run: docker stack deploy --with-registry-auth --detach=false -c deploy/stack.yml "$STACK"
      # Gate the build on the running SHA, NOT just on "docker stack deploy exited 0".
      # A boot/migration crash or a node out of disk makes Swarm silently roll back to
      # the previous image (service stays 2/2 on the OLD sha) while CI stays green — the
      # long-standing "green CI ≠ deployed" trap. Poll /api/version (routing mesh →
      # localhost:PORT) until the new sha serves for 3 consecutive reads (both replicas
      # converged + stable); fail the job with diagnostics if it never does.
      - name: Verify rollout converged to the new SHA
        env:
          STACK: ${{ needs.meta.outputs.stack }}
          PORT: ${{ needs.meta.outputs.port }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for ${STACK} to converge to ${SHA:0:12} on :${PORT} ..."
          streak=0
          for i in $(seq 1 40); do
            cur=$(curl -s -m 5 "http://localhost:${PORT}/api/version" | grep -oE '"sha":"[a-f0-9]+"' | cut -d'"' -f4)
            if [ "$cur" = "$SHA" ]; then streak=$((streak+1)); else streak=0; fi
            echo "  [$i] serving=${cur:0:12} streak=${streak}"
            if [ "$streak" -ge 3 ]; then echo "✅ converged to ${SHA:0:12}"; exit 0; fi
            sleep 3
          done
          echo "::error::${STACK} did NOT converge to ${SHA:0:12} within ~120s — boot crash + Swarm rollback, or a node out of disk."
          echo "===== service state ====="
          docker service ls --filter name="${STACK}"
          docker service ps "${STACK}_app" --no-trunc | head -8
          echo "===== failed/rejected task startup logs (crash diagnostics) ====="
          FAILED=$(docker service ps "${STACK}_app" --no-trunc --format '{{.ID}} {{.CurrentState}}' | grep -iE 'Failed|Rejected' | head -1 | awk '{print $1}')
          echo "failed task: ${FAILED:-<none>}"
          if [ -n "$FAILED" ]; then docker service logs --raw "$FAILED" 2>&1 | tail -80 || true; fi
          exit 1
